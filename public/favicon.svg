<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="sx-chrome" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="55%" stop-color="#E5E7EB" />
      <stop offset="100%" stop-color="#9CA3AF" />
    </linearGradient>
    <linearGradient id="sx-red" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF2E38" />
      <stop offset="100%" stop-color="#C5000A" />
    </linearGradient>
  </defs>
  <rect width="128" height="128" rx="28" fill="#050505"/>
  <rect width="124" height="124" x="2" y="2" rx="26" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="2"/>
  <!-- Stylized S -->
  <text x="42" y="86" font-family="'Impact', 'Arial Black', sans-serif" font-weight="900" font-size="74" font-style="italic" fill="url(#sx-chrome)" text-anchor="middle">S</text>
  <!-- Stylized X -->
  <text x="86" y="86" font-family="'Impact', 'Arial Black', sans-serif" font-weight="900" font-size="74" font-style="italic" fill="url(#sx-red)" text-anchor="middle">X</text>
  <!-- Sport underline accent -->
  <line x1="22" y1="102" x2="106" y2="102" stroke="#E50914" stroke-width="3" stroke-linecap="round"/>
</svg>
